name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Lighthouse audit (warning only)
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        with:
          staticDistDir: ./dist
          urls: |
            http://localhost/
          budgetPath: ""
